<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">FARAD Energy Systems icon</title>
  <desc id="desc">Circular blue-green FARAD mark with a white center and black plus symbol.</desc>

  <defs>
    <radialGradient id="outerGradient" cx="70%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#38a8a3"/>
      <stop offset="55%" stop-color="#247f95"/>
      <stop offset="100%" stop-color="#18628e"/>
    </radialGradient>

    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="82%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef4f7"/>
    </radialGradient>

    <filter id="softInset" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset dx="0" dy="0" result="offsetBlur"/>
      <feComposite in="offsetBlur" in2="SourceAlpha" operator="out" result="inverse"/>
      <feFlood flood-color="#d6e1e8" flood-opacity="0.85" result="color"/>
      <feComposite in="color" in2="inverse" operator="in" result="shadow"/>
      <feComposite in="shadow" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Outer circular mark -->
  <circle cx="256" cy="256" r="236" fill="url(#outerGradient)" filter="url(#softInset)"/>

  <!-- White inner circle -->
  <circle cx="256" cy="256" r="82" fill="url(#innerGlow)"/>

  <!-- Plus symbol -->
  <g fill="#111111">
    <rect x="238" y="205" width="36" height="102" rx="8"/>
    <rect x="205" y="238" width="102" height="36" rx="8"/>
  </g>
</svg>
